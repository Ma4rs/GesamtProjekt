<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Gewinnleiter</title>
  <link href="./css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./js/app.js"></script>

  <div class="bet-panel">
    <div class="chip-buttons">
      <button class="chip-1" onclick="addBet(1)">1</button>
      <button class="chip-5" onclick="addBet(5)">5</button>
      <button class="chip-10" onclick="addBet(10)">10</button>
      <button class="chip-100" onclick="addBet(100)">100</button>
      <button class="chip-all" onclick="betAll()">All</button>
      <button class="chip-clear" onclick="clearBet()">Clear</button>
    </div>

    <div class="balance-display">
      <div id="balanceDisplay">0</div>
      <div id="betDisplay">0</div>
    </div>

    <button id="startBtn" onclick="startGame()">Start</button>
  </div>

  <div class="ladder" id="ladder"></div>

  <div class="action-buttons">
    <button class="btn-risk" onclick="risk()">Risiko</button>
    <button class="btn-collect" onclick="collect()">Auszahlen</button>
  </div>
</body>
</html>
