<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Poker Tisch mit Karten</title>
</head>
<body>

  <div
    style="
      width: 100%;
      height: 470px;
      background-image: url('A_2D_digital_illustration_depicts_an_oval-shaped_p.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      position: relative;
    ">

    <!-- Karte 1: Herz Ass -->
    <div style="
      width: 60px;
      height: 90px;
      background-color: white;
      border: 1px solid black;
      border-radius: 8px;
      position: absolute;
      top: 190px;
      left: 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: red;
    ">
      ♥A
    </div>

    <!-- Karte 2: Pik König -->
    <div style="
      width: 60px;
      height: 90px;
      background-color: white;
      border: 1px solid black;
      border-radius: 8px;
      position: absolute;
      top: 190px;
      left: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: black;
    ">
      ♠K
    </div>

  </div>

</body>
</html>
